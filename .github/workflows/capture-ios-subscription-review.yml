name: Capture native iOS subscription review screen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare native app and open its existing plan screen
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run sync:web
          python3 - <<'PY'
          from pathlib import Path
          path = Path('www/index.html')
          html = path.read_text(encoding='utf-8')
          probe = '<script>window.__captureErrors=[];window.addEventListener("error",e=>window.__captureErrors.push(String(e.message).slice(0,180)));window.addEventListener("unhandledrejection",e=>window.__captureErrors.push(String(e.reason).slice(0,180)));</script>'
          assert '</head>' in html
          html = html.replace('</head>', probe + '</head>', 1)
          automation = '''<script>
          let planAttempts = 0;
          const planTimer = setInterval(() => {
            const guest = document.getElementById('welcomeGuest');
            const welcome = document.getElementById('welcomeDialog');
            const dialog = document.getElementById('proPlanDialog');
            const booting = document.documentElement.classList.contains('auth-booting');
            const settings = document.querySelector('.bottom-nav [data-tab="settings"]');
            const upgrade = document.getElementById('accountUpgrade');
            if (!booting && welcome && welcome.open && guest && guest.onclick) guest.click();
            if (!booting && (!welcome || !welcome.open) && dialog && !dialog.open) {
              if (settings) settings.click();
              if (typeof openProPlanDialog === 'function') openProPlanDialog();
              else if (upgrade) upgrade.click();
            }
            if (dialog && dialog.open) { clearInterval(planTimer); return; }
            if (++planAttempts >= 80) clearInterval(planTimer);
          }, 1000);
          setTimeout(() => {
            const dialog = document.getElementById('proPlanDialog');
            if (dialog && dialog.open) return;
            const note = document.createElement('div');
            note.textContent = 'capture: boot=' + document.documentElement.classList.contains('auth-booting') +
              ' welcome=' + !!document.getElementById('welcomeDialog')?.open +
              ' guest=' + !!document.getElementById('welcomeGuest')?.onclick +
              ' settings=' + !!document.querySelector('.bottom-nav [data-tab="settings"]')?.onclick +
              ' upgrade=' + !!document.getElementById('accountUpgrade')?.onclick +
              ' active=' + document.documentElement.dataset.activeTab +
              ' error=' + (window.__captureErrors||[]).join(' | ').slice(0,200);
            note.style.cssText = 'position:fixed;top:80px;left:0;z-index:999999;background:white;color:black;font:20px monospace;padding:10px';
            document.body.appendChild(note);
          }, 40000);
          </script>
          '''
          assert '</body>' in html
          path.write_text(html.replace('</body>', automation + '</body>'), encoding='utf-8')
          PY
          node scripts/patch-ios-bridge.mjs
          npx cap sync ios
          grep -q 'planAttempts' ios/App/App/public/index.html

      - name: Build and capture actual native screen
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r["identifier"]))')"
          DEVICE_TYPE='com.apple.CoreSimulator.SimDeviceType.iPhone-11-Pro-Max'
          if ! xcrun simctl list devicetypes | grep -q 'iPhone 11 Pro Max'; then
            DEVICE_TYPE='com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max'
          fi
          DEVICE_ID="$(xcrun simctl create 'Meow Work Subscription Capture' "$DEVICE_TYPE" "$RUNTIME_ID")"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project native/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/meow-derived" CODE_SIGNING_ALLOWED=NO build
          APP_PATH="$RUNNER_TEMP/meow-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.lumilab.meowwork
          sleep 25
          mkdir -p store-assets/native-ios
          xcrun simctl io "$DEVICE_ID" screenshot store-assets/native-ios/pro-plan-original.png
          sleep 20
          xcrun simctl io "$DEVICE_ID" screenshot store-assets/native-ios/pro-plan-late.png
          sips -g pixelWidth -g pixelHeight store-assets/native-ios/pro-plan-original.png

      - uses: actions/upload-artifact@v4
        with:
          name: native-ios-subscription-review-screen
          path: store-assets/native-ios/pro-plan-*.png
