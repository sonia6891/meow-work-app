name: Retrieve native iOS subscription capture

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Capture workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: native-ios-subscription-review-screen
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: store-assets/native-ios
      - name: Save captures for review
        run: |
          set -euo pipefail
          test -s store-assets/native-ios/pro-plan-original.png
          test -s store-assets/native-ios/pro-plan-late.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store-assets/native-ios/pro-plan-original.png store-assets/native-ios/pro-plan-late.png
          if git diff --cached --quiet; then echo 'Capture unchanged'; exit 0; fi
          git commit -m 'chore: preserve native iOS subscription review captures [skip ci]'
          git push origin HEAD:main
