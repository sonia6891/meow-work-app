name: Deploy Supabase verification and billing functions
on:
  push:
    branches: [main]
    paths:
      - supabase/functions/payslip-verify/**
      - supabase/functions/billing-config/**
      - supabase/functions/verify-google-play-purchase/**
      - supabase/functions/google-play-rtdn/**
      - supabase/functions/_shared/**
      - supabase/config.toml
      - .github/workflows/deploy-payslip-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ygrlvmyqrhyfkglomsbq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Test Google Play entitlement state mapping
        run: deno test tests/google-play-entitlement.test.ts
      - name: Type-check billing Edge Functions
        run: >-
          deno check
          supabase/functions/_shared/google-play.ts
          supabase/functions/verify-google-play-purchase/index.ts
          supabase/functions/google-play-rtdn/index.ts
          supabase/functions/billing-config/index.ts
      - name: Require Supabase deployment credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Repository secret SUPABASE_ACCESS_TOKEN is required to deploy Supabase verification and billing functions." >&2
            exit 1
          fi
      - name: Deploy Supabase functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ygrlvmyqrhyfkglomsbq
        run: supabase functions deploy payslip-verify --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy store and Play billing verification functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ygrlvmyqrhyfkglomsbq
        run: |
          supabase functions deploy billing-config --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy verify-app-store-transaction --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy app-store-notifications-v2 --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy verify-google-play-purchase --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy google-play-rtdn --project-ref "$SUPABASE_PROJECT_ID"
      - name: Configure fixed Google Play package name
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ygrlvmyqrhyfkglomsbq
        run: supabase secrets set GOOGLE_PLAY_PACKAGE_NAME=com.lumilab.meowwork --project-ref "$SUPABASE_PROJECT_ID"
