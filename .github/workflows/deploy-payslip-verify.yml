name: Deploy payslip verification function
on:
  push:
    branches: [main]
    paths:
      - supabase/functions/payslip-verify/**
      - .github/workflows/deploy-payslip-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ygrlvmyqrhyfkglomsbq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require Supabase deployment credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Repository secret SUPABASE_ACCESS_TOKEN is required to deploy payslip-verify." >&2
            exit 1
          fi
      - name: Deploy payslip-verify
        run: supabase functions deploy payslip-verify --project-ref "$SUPABASE_PROJECT_ID"
