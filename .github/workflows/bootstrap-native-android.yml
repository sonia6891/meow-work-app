name: Bootstrap native Android project

on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - support.html
      - terms.html
      - privacy.html
      - assets/**
      - workcat-home-v12.png
      - native/package.json
      - native/package-lock.json
      - native/capacitor.config.json
      - native/scripts/**
      - native/android-sources/**
      - native/.gitignore
      - .github/workflows/bootstrap-native-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-native-android-main
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify checked-in brand artwork
        run: |
          test -s app-icon-v178-180.png
          test -s app-icon-v178-192.png
          test -s app-icon-v178-512.png
          test -s splash-v183.jpg

      - name: Install pinned Capacitor platforms
        working-directory: native
        run: npm ci

      - name: Generate and patch the Play project
        working-directory: native
        run: |
          rm -rf android
          npm run sync:web
          npx cap add android
          node scripts/patch-android-billing.mjs
          npx cap sync android

      - name: Build Android debug APK
        working-directory: native/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build unsigned Android release bundle
        working-directory: native/android
        run: ./gradlew --no-daemon bundleRelease

      - name: Save generated native project
        run: |
          git add native/android
          if git diff --cached --quiet; then
            echo "Generated Android project is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate Android Play Billing project"
            git push
          fi
